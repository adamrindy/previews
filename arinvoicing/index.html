<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="copyright" content="© 2026 Adam Rindy. All rights reserved.">
<title>ARinvoicing — Preview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161617'/%3E%3Ctext x='32' y='42' font-family='Helvetica' font-weight='700' font-size='26' fill='white' text-anchor='middle'%3EAR%3C/text%3E%3C/svg%3E">
<style>:root{
  --bg:#f4f3f1; --panel:#fff; --ink:#1b1b1c; --muted:#6d6d72; --line:#e3e1dd; --line2:#d3d0cb;
  --side:#161617; --side-ink:#c9c8c5; --accent:#1b1b1c; --hi:#2f6fed;
  --ok:#1f8a4c; --warn:#b7791f; --bad:#c0392b; --info:#2f6fed;
  --r:10px; --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
#app{display:grid;grid-template-columns:212px 1fr;height:100vh}
#print-root{display:none}

/* sidebar */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px;gap:2px}
.brand{color:#fff;font-weight:700;letter-spacing:.04em;font-size:15px;padding:4px 10px 18px}
.brand small{display:block;font-weight:400;color:#77767a;letter-spacing:0;font-size:11px;margin-top:2px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;text-decoration:none;cursor:pointer}
.nav:hover{background:#232325;color:#fff}
.nav.on{background:#2c2c2f;color:#fff}
.nav .ct{margin-left:auto;font-size:11px;background:#3a3a3e;border-radius:9px;padding:0 7px;color:#fff}
.nav .ct.warn{background:var(--warn)}
.side .grow{flex:1}
.side .newbtn{margin:6px 0 14px}
.store{font-size:11px;color:#8b8a8e;padding:8px 10px;border-top:1px solid #29292b;line-height:1.4}
.store b{color:#d9d8d5;font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:#777}
.dot.ok{background:#3ccf7a}.dot.warn{background:#f0b44a}.dot.bad{background:#ef5b4c}

/* main */
.main{overflow:auto;height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:28px 32px 60px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.head h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
.head .sp{flex:1}
.sub{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#aaa}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#000}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#0000000d}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
.side .btn.pri{background:#fff;color:#111;border-color:#fff;justify-content:center;width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.grid{display:grid;gap:10px 14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.span2{grid-column:span 2}.span3{grid-column:span 3}.spanall{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:500}
label.f>span{white-space:nowrap}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=search],select,textarea{
  width:100%;border:1px solid var(--line2);border-radius:7px;padding:6px 8px;background:#fff;color:var(--ink);font-size:13px;min-width:0}
textarea{resize:vertical;min-height:62px;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid #2f6fed55;border-color:var(--hi)}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;color:var(--ink)}
.chk input{margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{font-size:11.5px;color:var(--muted)}
.empty{padding:34px;text-align:center;color:var(--muted)}

/* tables */
table.t{width:100%;border-collapse:collapse;background:#fff}
.t th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:#faf9f7}
.t .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tablecard{padding:0;overflow:hidden}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;background:#eee;color:#444;white-space:nowrap}
.b-draft{background:#eceae6;color:#555}.b-sent{background:#e3ecfd;color:#1d4fbf}.b-paid{background:#dff3e7;color:#1f7a45}
.b-overdue{background:#fbe3e0;color:#a8321f}.b-void{background:#eee;color:#999;text-decoration:line-through}
.b-approved{background:#dff3e7;color:#1f7a45}.b-declined{background:#f1e6e6;color:#8a4a4a}
.b-active{background:#dff3e7;color:#1f7a45}.b-expiring{background:#fdf0d8;color:#94600f}.b-expired{background:#fbe3e0;color:#a8321f}
.b-pending{background:#e9e6f7;color:#4b3c9a}.b-perpetual{background:#e3ecfd;color:#1d4fbf}.b-upcoming{background:#e7f3f6;color:#1f6a7a}
.b-est{background:#f2eadb;color:#7a5a22}
.kind{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* filters */
.filters{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.filters input[type=search]{width:280px}
.filters select{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line2);background:#fff;border-radius:16px;padding:3px 11px;cursor:pointer;font-size:12px}
.chipbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .v{font-size:21px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
.stat .v small{font-size:12px;font-weight:500;color:var(--muted)}
.dash2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* editor */
.editor{display:grid;grid-template-columns:minmax(470px,560px) 1fr;height:100vh}
.ed-left{overflow:auto;padding:18px 18px 80px;border-right:1px solid var(--line);background:var(--bg)}
.ed-right{overflow:auto;background:#8d8b88;padding:26px;position:relative}
.ed-top{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.ed-top h1{font-size:18px;margin:0 6px 0 0}
.preview-holder{margin:0 auto;box-shadow:0 4px 30px #0005;background:#fff;transform-origin:top left}
.pv-tools{position:sticky;top:-26px;margin:-26px -26px 18px;padding:8px 14px;background:#7b7976ee;display:flex;gap:8px;align-items:center;color:#fff;z-index:2;backdrop-filter:blur(4px)}
.pv-tools .btn{background:#ffffff1f;border-color:#ffffff33;color:#fff}
.pv-tools .btn:hover{background:#ffffff33}
.pv-tools .sp{flex:1}

.li{border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;background:#fcfbfa}
.li-top{display:grid;grid-template-columns:1fr 1.5fr auto;gap:8px;align-items:center}
.li-nums{display:grid;grid-template-columns:62px 1fr 92px 62px 62px auto;gap:8px;align-items:end;margin-top:8px}
.li-nums label.f{font-size:10.5px}
.li .tot{font-weight:600;text-align:right;min-width:86px;padding-bottom:6px;font-variant-numeric:tabular-nums}
.li .x{color:#999;border:0;background:none;cursor:pointer;font-size:16px;padding:2px 6px;border-radius:5px}
.li .x:hover{color:var(--bad);background:#0000000a}
.catrow{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 2px 6px;font-weight:600}
.lic{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:#fcfbfa}
.presetchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.presetchips button{font-size:11px;border:1px dashed var(--line2);background:#fff;border-radius:12px;padding:1px 8px;cursor:pointer}
.presetchips button:hover{border-style:solid}
.totbox{display:grid;grid-template-columns:1fr auto;gap:3px 18px;font-variant-numeric:tabular-nums}
.totbox .big{font-weight:700;font-size:15px}

/* modal */
.modal-bg{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:60px 20px;overflow:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:560px;padding:20px 22px;box-shadow:0 20px 60px #0004}
.modal h2{margin:0 0 14px;font-size:17px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1b1b1c;color:#fff;padding:9px 16px;border-radius:9px;z-index:99;box-shadow:0 6px 24px #0004;font-size:13px}
.banner{background:#fff6e0;border:1px solid #f1d58a;border-radius:9px;padding:10px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.banner .sp{flex:1}

/* settings */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.tab.on{border-color:var(--ink);color:var(--ink)}
.cat{border:1px solid var(--line);border-radius:9px;margin-bottom:12px;background:#fff}
.cat-h{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:#faf9f7;border-radius:9px 9px 0 0}
.cat-h input{font-weight:600;max-width:260px}
.cat-items{padding:6px 12px 10px}
.ci{display:grid;grid-template-columns:1.6fr 110px 110px 74px 64px auto;gap:8px;align-items:center;padding:4px 0}
.ci.h{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ordlist .oi{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:#fff}
.ordlist .oi .nm{flex:1}
.imgbox{width:120px;height:80px;border:1px dashed var(--line2);border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fafafa;overflow:hidden}
.imgbox img{max-width:100%;max-height:100%}

/* ============ INVOICE DOCUMENT ============ */
.inv{width:816px;min-height:1056px;background:#fff;color:#111;padding:44px 52px 48px;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:11.5px;line-height:1.42;position:relative}
.inv.paper-legal{min-height:1344px}.inv.paper-a4{width:794px;min-height:1123px}
.inv.font-georgia{font-family:Georgia,"Times New Roman",serif}
.inv.font-avenir{font-family:"Avenir Next",Avenir,"Helvetica Neue",Helvetica,sans-serif}
.inv.font-mono{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:10.5px}
.inv .i-top{display:flex;justify-content:space-between;align-items:flex-end}
.inv .i-logo img{display:block;object-fit:contain}
.inv .i-top.center{flex-direction:column;align-items:center;gap:10px}
.inv .i-title{font-size:22px;font-weight:700;letter-spacing:-.01em}
.inv .i-biz{display:flex;justify-content:space-between;margin-top:10px;padding-bottom:7px;border-bottom:1.5px solid var(--acc,#111)}
.inv .i-biz b{font-weight:700}
.inv .i-biz .r{text-align:right}
.inv .i-client{display:grid;grid-template-columns:1fr 1fr;padding:9px 0 12px;border-bottom:1.5px solid var(--acc,#111)}
.inv .i-meta b{font-weight:700}
.inv .i-sec{margin-top:11px;break-inside:avoid}
.inv .i-lab{font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;color:#8a8a8a;margin-bottom:3px}
.inv .i-job{font-size:13px;font-weight:700}
.inv .i-pre{white-space:pre-wrap}
.inv .i-pay{margin-top:11px}
.inv .i-pay + .i-pay{margin-top:12px}
.inv .i-items{margin-top:30px;border-top:2px solid var(--acc,#111);padding-top:6px}
.inv .i-cat{margin-bottom:12px;break-inside:avoid}
.inv .i-cat h4{margin:0 0 3px;font-size:11.5px;font-weight:700}
.inv .i-line{display:flex;justify-content:space-between;gap:20px;padding:1px 0 1px 8px;break-inside:avoid}
.inv .i-line .d{flex:1}
.inv .i-line .d small{display:block;color:#666;font-size:10px}
.inv .i-line .a,.inv .i-ct .a,.inv .i-tots .a{font-variant-numeric:tabular-nums;text-align:right;min-width:90px}
.inv .i-ct{display:flex;justify-content:flex-end;gap:20px;padding-top:2px}
.inv .i-ct .a{font-weight:700}
.inv .i-tots{margin:14px 0 0 auto;width:265px;border-top:1px solid #111;border-bottom:1.5px solid #111;padding:0 0 8px;break-inside:avoid}
.inv .i-tots div.dbl{display:block;border-top:1px solid #111;margin:2px 0 6px;height:0}
.inv .i-tots div{display:flex;justify-content:flex-end;gap:20px}
.inv .i-tots .k{text-align:right}
.inv .i-tots .grand{font-weight:700}
.inv .i-sig{margin-top:44px;break-inside:avoid}
.inv .i-sig img{display:block;width:170px}
.inv .i-sig .sl{border-top:1px solid #999;width:220px;margin-top:2px;padding-top:2px;font-size:9px;color:#888}
.inv .i-foot{margin-top:28px;font-size:9.5px;color:#777;text-align:center;white-space:pre-wrap}
.inv .i-notes{white-space:pre-wrap}
.inv .ln{color:#888;margin-right:6px}
.inv .watermark{position:absolute;top:40%;left:0;right:0;text-align:center;font-size:110px;font-weight:800;color:#0000000d;transform:rotate(-24deg);pointer-events:none;letter-spacing:.05em}

@media print{
  html,body{background:#fff;height:auto}
  #app,.toast,.modal-bg{display:none!important}
  #print-root{display:block}
  #print-root .inv{width:auto;min-height:0;padding:0;box-shadow:none}
}

.vers{border-top:none;padding-top:0}
.vers a{color:#b9b8b5}
.pv-tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#f3c969;color:#111;border-radius:4px;padding:0 5px;margin-right:2px}
.inv .i-appr{margin-top:34px}
.inv .i-apl{display:flex;gap:40px;margin-top:22px}
.inv .i-apl div{display:flex;align-items:flex-end;gap:8px;flex:1}
.inv .i-apl div:last-child{flex:.6}
.inv .i-apl i{flex:1;border-bottom:1px solid #111;height:1px}
.inv .i-apn{font-size:9px;color:#888;margin:4px 0 0 60px}

.ktag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 5px;margin-right:7px;vertical-align:1px}
.ktag.c{background:#e6e3dd;color:#555}.ktag.p{background:#e3ecfd;color:#1d4fbf}
</style>
</head>
<body>
<div id="app"><nav class="side" id="side"></nav><main class="main" id="main"><div class="empty">Loading…</div></main></div>
<div id="print-root"></div>

const store = {

  async init() {
    if (!this.supported) { this.status = 'unsupported'; return; }

      const p = await this.dir.queryPermission({ mode: 'readwrite' });

    } catch (e) { this.status = 'error'; this.error = String(e); }

  async choose() {

    this.dir = dir; await IDB.set('dirHandle', dir); this.status = 'ok';
    return dir;
  },
  async reconnect() {
    if (!this.dir) return false;
    const p = await this.dir.requestPermission({ mode: 'readwrite' });
    this.status = p === 'granted' ? 'ok' : 'needs-permission';
    return this.status === 'ok';
  },
  async readFile() {
    if (this.status !== 'ok') return null;

    catch (e) { if (e.name === 'NotFoundError') return null; throw e; }

    const text = JSON.stringify(state, null, 1);
    await IDB.set('state', state);

      try {
        await this.write(DATA_FILE, text);
        const day = todayISO();
        if (state.meta.lastBackupDay !== day) { await this.write(`ARinvoicing-backup-${day}.json`, text, 'backups'); state.meta.lastBackupDay = day; await IDB.set('state', state); await this.write(DATA_FILE, JSON.stringify(state, null, 1)); }

const PAPER = { letter: '8.5in 11in', legal: '8.5in 14in', a4: '210mm 297mm' };
function docFileName(doc) {
  const c = clientById(doc.clientId);
  return `${doc.kind === 'estimate' ? 'Estimate' : 'Invoice'} ${doc.number}${doc.jobName ? ' - ' + doc.jobName : ''}${c ? ' - ' + clientName(c) : ''}`.replace(/[\\/:*?"<>|]+/g, '').slice(0, 120);
}
const PAPER_PX = { letter: [816, 1056], legal: [816, 1344], a4: [794, 1123] };
function exportPDF(doc) {
  const root = $('#print-root'); const mode = S.layout.pdfMode || 'long';
  root.innerHTML = renderInvoice(doc); root.className = 'pm-' + mode;
  let st = $('#page-style'); if (!st) { st = document.createElement('style'); st.id = 'page-style'; document.head.appendChild(st); }
  if (mode === 'paged') {
    st.textContent = `@page{size:${PAPER[S.layout.paper]};margin:0.5in 0.55in}`;
  } else {
    // measure the invoice at full size (off-screen, screen styles)
    const host = document.createElement('div'); host.style.cssText = 'position:fixed;left:-10000px;top:0';
    host.innerHTML = renderInvoice(doc); document.body.appendChild(host);
    const inv = host.firstElementChild; inv.style.minHeight = '0';
    const w = inv.offsetWidth, h = inv.scrollHeight; host.remove();
    const [pw, ph] = PAPER_PX[S.layout.paper] || PAPER_PX.letter;
    if (mode === 'long') {
      const H = Math.max(h, ph) + 4;
      st.textContent = `@page{size:${w}px ${H}px;margin:0}#print-root .inv{width:${w}px!important;padding:44px 52px 48px!important;min-height:0!important}`;
    } else { // fit: shrink onto one standard sheet
      const z = Math.min(1, (ph - 2) / h);
      st.textContent = `@page{size:${PAPER[S.layout.paper]};margin:0}#print-root .inv{width:${w}px!important;padding:44px 52px 48px!important;min-height:0!important;zoom:${z.toFixed(4)};margin:0 auto}`;
    }
  }
  const old = document.title; document.title = docFileName(doc);
  const done = () => { document.title = old; root.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  markSentIfDraft(doc);
  setTimeout(() => window.print(), 60);
}
async function exportJPEG(doc) {
  if (typeof html2canvas !== 'function') { toast('JPEG export library missing'); return; }
  const host = document.createElement('div'); host.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff';
  host.innerHTML = renderInvoice(doc); document.body.appendChild(host);
  try {
    await Promise.all($$('img', host).map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })));
    const canvas = await html2canvas(host.firstElementChild, { scale: 2, backgroundColor: '#ffffff', logging: false });
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92));
    await saveBlob(blob, docFileName(doc) + '.jpg', 'image/jpeg', '.jpg');
    markSentIfDraft(doc);
  } catch (e) { console.error(e); toast('JPEG export failed: ' + e.message); }
  finally { host.remove(); }
}
async function saveBlob(blob, name, mime, ext) {
  if (window.showSaveFilePicker) {
    try {
      const fh = await window.showSaveFilePicker({ suggestedName: name, id: 'arinvoicing-export', types: [{ description: ext.toUpperCase(), accept: { [mime]: [ext] } }] });
      const w = await fh.createWritable(); await w.write(blob); await w.close(); toast('Saved ' + fh.name); return;
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function markSentIfDraft(doc) {
  if (doc.status === 'draft') {
    confirmModal(`Mark ${doc.kind} ${doc.number} as sent?`, 'You just exported it. Marking it as sent starts tracking whether it\'s been paid.', 'Mark as sent').then(ok => {
      if (ok) { doc.status = 'sent'; doc.sentDate = doc.sentDate || todayISO(); touch(doc); render(); }
    });
  }
}

function modal(html, { wide = false } = {}) {

  bg.innerHTML = `<div class="modal" style="${wide ? 'max-width:760px' : ''}">${html}</div>`;
  document.body.appendChild(bg);
  bg.addEventListener('mousedown', e => { if (e.target === bg) bg.remove(); });
  const f = $('input,textarea,select', bg); if (f) setTimeout(() => f.focus(), 30);

}
function confirmModal(title, text, okLabel = 'OK', danger = false) {

  });
}

function viewJobs() {
  const q = ui.jobsQ.toLowerCase();
  const years = [...new Set(S.documents.map(d => (d.date || '').slice(0, 4)).filter(Boolean))].sort().reverse();
  let list = S.documents.filter(d => {
    if (ui.jobsKind !== 'all' && d.kind !== ui.jobsKind) return false;

    if (ui.jobsYear !== 'all' && !(d.date || '').startsWith(ui.jobsYear)) return false;

function presetChip(btn, scope) {
  const box = btn.closest('[data-lic]'); const l = S.licenses.find(x => x.id === box.dataset.lic); const f = btn.dataset.preset; const v = btn.dataset.val;
  const parts = (l[f] || '').split(';').map(s => s.trim()).filter(Boolean);
  if (parts.includes(v)) l[f] = parts.filter(p => p !== v).join('; '); else l[f] = [...parts, v].join('; ');
  const ta = $(`[data-lk="${f}"]`, box); if (ta) ta.value = l[f];
  touch(l); refreshPreview();
}
function licInput(e, after) {
  const el = e.target; if (!el.dataset.lk) return false;
  const box = el.closest('[data-lic]'); const l = S.licenses.find(x => x.id === box.dataset.lic); if (!l) return false;
  const k = el.dataset.lk; l[k] = k === 'durationValue' ? parseNum(el.value, 0) : el.value;
  touch(l);
  if (e.type === 'change' && ['durationUnit', 'startMode', 'durationValue', 'startDate', 'firstUseDate', 'issueDate'].includes(k)) {
    const tmp = document.createElement('div'); tmp.innerHTML = licenseFields(l); box.replaceWith(tmp.firstElementChild);
  }
  refreshPreview(); after && after(); return true;
}

let curDoc = null;
function refreshPreview() {
  const pv = $('#preview'); if (!pv || !curDoc) return;
  pv.innerHTML = renderInvoice(curDoc); fitPreview();
}
function fitPreview() {
  const right = $('#ed-right'), pv = $('#preview'), sc = $('#pv-scale'); if (!right || !pv) return;
  const inv = pv.firstElementChild; if (!inv) return;
  const w = inv.offsetWidth; const avail = right.clientWidth - 52;
  const z = Math.min(1.1, avail / w);
  pv.style.width = w + 'px'; pv.style.zoom = z;
}
window.addEventListener('resize', () => fitPreview());
function mountDoc() {
  curDoc = docById(route.id); if (!curDoc) return;
  refreshPreview();
  const left = $('#ed-left');
  const d = curDoc;
  const refreshTotals = () => { $('#totbox').innerHTML = totBox(d); };
  const reItems = () => { $('#items').innerHTML = itemsHTML(d); refreshTotals(); refreshPreview(); };
  const onField = e => {
    const el = e.target;
    if (licInput(e)) return;
    if (el.dataset.f) {
      const k = el.dataset.f;
      let v = el.type === 'checkbox' ? el.checked : el.value;
      if (el.hasAttribute('data-money')) v = parseMoney(v);
      else if (['termsDays', 'taxPct'].includes(k)) v = parseNum(v, 0);
      d[k] = v;
      if (k === 'termsDays' || k === 'date') { if (d.kind === 'invoice') { d.dueDate = addDays(d.date, d.termsDays); const dd = $('[data-f="dueDate"]', left); if (dd) dd.value = d.dueDate; } }
      if (k === 'status' && v === 'paid') { if (!d.paidDate) { d.paidDate = todayISO(); const pd = $('[data-f="paidDate"]', left); if (pd) pd.value = d.paidDate; } if (!d.paidCents) { d.paidCents = totals(d).balance; const pc = $('[data-f="paidCents"]', left); if (pc) pc.value = moneyInput(d.paidCents); } }
      if (k === 'status' && v === 'sent' && !d.sentDate) { d.sentDate = todayISO(); const sd = $('[data-f="sentDate"]', left); if (sd) sd.value = d.sentDate; }
      if (k === 'clientId') {
        const c = clientById(v);
        licensesFor(d.id).forEach(l => { l.clientId = v; if (!l.licensee) l.licensee = defaultLicensee(c); });
        if (c && c.kind !== 'person' && !d.contacts.length) { const ppl = peopleAt(c.id); if (ppl.length === 1) d.contacts.push({ id: uid(), personId: ppl[0].id, role: ppl[0].title || '', print: true }); }
      }
      touch(d);
      if (e.type === 'change' && ['currency', 'status', 'clientId', 'number'].includes(k)) { const sc = left.scrollTop; left.innerHTML = editorForm(d); left.scrollTop = sc; renderShell(); }
      else if (['discountCents', 'taxPct', 'advanceCents', 'taxLabel'].includes(k)) refreshTotals();
      refreshPreview(); return;
    }
    const row = el.closest('[data-item]');
    if (row && el.dataset.k) {
      const it = d.items.find(i => i.id === row.dataset.item); const k = el.dataset.k;
      let v = el.type === 'checkbox' ? el.checked : el.value;
      if (el.hasAttribute('data-money')) v = parseMoney(v); else if (['qty', 'duration', 'markupPct'].includes(k)) v = parseNum(v, 0);
      it[k] = v;
      if (k === 'categoryId') it.categoryName = catById(v)?.name || it.categoryName;
      if (k === 'name' && e.type === 'change') { // picked a catalog item → fill defaults if rate empty
        const ci = (catById(it.categoryId)?.items || []).find(i => i.name === v);
        if (ci && !it.rateCents) { it.rateCents = ci.rateCents; it.unit = ci.unit; it.markupPct = ci.markupPct || 0; it.taxable = !!ci.taxable; touch(d); reItems(); return; }
      }
      touch(d);
      if (e.type === 'change' && ['categoryId', 'unit'].includes(k)) { reItems(); return; }
      const tt = $(`[data-tot="${it.id}"]`, left); if (tt) tt.textContent = money(lineTotal(it, d.currency), d.currency);
      refreshTotals(); refreshPreview(); return;
    }
    if (el.dataset.cc) {
      const x = d.contacts.find(y => y.id === el.closest('[data-ct]').dataset.ct); const k = el.dataset.cc;
      x[k] = el.type === 'checkbox' ? el.checked : el.value;
      if (k === 'personId' && !x.role) { const p = clientById(x.personId); if (p?.title) { x.role = p.title; const r = $('[data-cc="role"]', el.closest('[data-ct]')); if (r) r.value = x.role; } }
      touch(d); refreshPreview(); return;
    }
    if (el.dataset.show) { d.show[el.dataset.show] = el.checked; touch(d); refreshPreview(); return; }
    if (el.dataset.pay) { const id = el.dataset.pay; d.paymentBlockIds = el.checked ? [...new Set([...d.paymentBlockIds, id])] : d.paymentBlockIds.filter(x => x !== id); touch(d); refreshPreview(); return; }
    if (el.id === 'quickadd' && el.value) {
      const [cid, iid] = el.value.split('|'); const c = catById(cid); const ci = c.items.find(i => i.id === iid);
      d.items.push({ id: uid(), categoryId: cid, categoryName: c.name, name: ci?.name || '', note: '', qty: 1, rateCents: ci?.rateCents || 0, unit: ci?.unit || 'day', duration: 1, markupPct: ci?.markupPct || 0, taxable: !!ci?.taxable });
      el.value = ''; touch(d); reItems(); return;
    }
    if (el.id === 'termspreset' && el.value) {
      const t = S.termsPresets.find(x => x.id === el.value); if (t) { d.termsText = t.text; if (t.days != null && d.kind === 'invoice') { d.termsDays = t.days; d.dueDate = addDays(d.date, t.days); } touch(d); const sc = left.scrollTop; left.innerHTML = editorForm(d); left.scrollTop = sc; refreshPreview(); }
    }
  };
  left.addEventListener('input', e => { if (e.target.type === 'checkbox' || e.target.tagName === 'SELECT') return; onField(e); });
  left.addEventListener('change', onField);
  left.addEventListener('click', async e => {
    const t = e.target;
    const pc = t.closest('[data-preset]'); if (pc) { presetChip(pc); return; }
    if (t.dataset.delct) { d.contacts = d.contacts.filter(x => x.id !== t.dataset.delct); touch(d); $('#jobcontacts').innerHTML = contactRows(d); refreshPreview(); return; }
    if (t.dataset.delitem) { d.items = d.items.filter(i => i.id !== t.dataset.delitem); touch(d); reItems(); return; }
    if (t.dataset.dellic) { S.licenses = S.licenses.filter(l => l.id !== t.dataset.dellic); touch(d); const sc = left.scrollTop; left.innerHTML = editorForm(d); left.scrollTop = sc; refreshPreview(); renderShell(); return; }
    const a = t.dataset.act; if (!a) return;
    if (a === 'add-line') { const c = S.categories[0]; d.items.push({ id: uid(), categoryId: c?.id || '', categoryName: c?.name || 'Fees', name: '', note: '', qty: 1, rateCents: 0, unit: 'day', duration: 1, markupPct: 0, taxable: false }); touch(d); reItems(); }
    if (a === 'add-lic') { S.licenses.push(newLicense(d)); touch(d); const sc = left.scrollTop; left.innerHTML = editorForm(d); left.scrollTop = sc; refreshPreview(); renderShell(); }
    if (a === 'new-company-doc' || a === 'new-person-doc') clientModal(null, c => { d.clientId = c.id; licensesFor(d.id).forEach(l => { l.clientId = c.id; if (!l.licensee) l.licensee = defaultLicensee(c); }); touch(d); render(); }, { kind: a === 'new-person-doc' ? 'person' : 'company' });
    if (a === 'add-contact') {
      const bill = clientById(d.clientId); const coId = bill ? (bill.kind === 'person' ? bill.companyId : bill.id) : '';
      const used = new Set(d.contacts.map(x => x.personId)); const next = peopleAt(coId).find(p => !used.has(p.id) && p.id !== d.clientId);
      d.contacts.push({ id: uid(), personId: next?.id || '', role: next?.title || '', print: true }); touch(d); $('#jobcontacts').innerHTML = contactRows(d); refreshPreview();
    }
    if (a === 'new-contact-person') {
      const bill = clientById(d.clientId); const coId = bill ? (bill.kind === 'person' ? bill.companyId : bill.id) : '';
      clientModal(null, p => { d.contacts.push({ id: uid(), personId: p.id, role: p.title || '', print: true }); touch(d); render(); }, { kind: 'person', companyId: coId });
    }
    if (a === 'edit-client-doc') clientModal(clientById(d.clientId), () => render());
    if (a === 'dup') duplicateDoc(d);
    if (a === 'convert') convertToInvoice(d);
    if (a === 'del-doc' && await confirmModal(`Delete ${d.kind} ${d.number}?`, 'Its usage licenses will be deleted too. This can\'t be undone (except by restoring a backup).', 'Delete', true)) {
      S.documents = S.documents.filter(x => x !== d); S.licenses = S.licenses.filter(l => l.docId !== d.id); touch(); go('#/jobs');
    }
  });
  setTimeout(fitPreview, 30);
}
function duplicateDoc(d) {
  const n = newDoc(d.kind); const keep = { id: n.id, number: n.number, status: 'draft', date: todayISO(), sentDate: '', paidDate: '', paidCents: 0, createdAt: n.createdAt, updatedAt: n.updatedAt };
  Object.assign(n, clone(d), keep); n.dueDate = addDays(n.date, n.termsDays); n.items = n.items.map(i => ({ ...i, id: uid() }));
  S.documents.push(n);
  licensesFor(d.id).forEach(l => S.licenses.push({ ...clone(l), id: uid(), docId: n.id, issueDate: n.date, firstUseDate: '', createdAt: nowISO(), updatedAt: nowISO() }));
  touch(n); go('#/doc/' + n.id); toast(`Duplicated as ${d.kind} ${n.number}`);
}
function convertToInvoice(est) {
  const n = newDoc('invoice'); const keep = { id: n.id, kind: 'invoice', number: n.number, status: 'draft', date: todayISO(), sentDate: '', paidDate: '', paidCents: 0, createdAt: n.createdAt, updatedAt: n.updatedAt, fromId: est.id, paymentBlockIds: n.paymentBlockIds };
  Object.assign(n, clone(est), keep); n.termsText = n.termsText || ''; n.dueDate = addDays(n.date, n.termsDays); n.items = n.items.map(i => ({ ...i, id: uid() }));
  S.documents.push(n); est.status = 'approved';
  licensesFor(est.id).forEach(l => { l.docId = n.id; touch(l); }); // license moves to the invoice
  touch(n); go('#/doc/' + n.id); toast(`Invoice ${n.number} created from estimate ${est.number}`);
}

async function importJSON(file, skipConfirm = false) {

    if (!skipConfirm && S && (S.documents.length || S.clients.length) && !(await confirmModal('Replace all current data?', `This file has ${data.documents.length} jobs, ${(data.clients || []).length} clients and ${(data.licenses || []).length} licenses. Everything currently in the app will be replaced.`, 'Replace', true))) return;
    if (S && store.status === 'ok') { try { await store.write(`ARinvoicing-before-restore-${Date.now()}.json`, JSON.stringify(S), 'backups'); } catch { } }

      const key = 'p|' + (c.email.toLowerCase() || (c.contactName + '|' + c.company).toLowerCase()); if (seen.has(key)) { empty++; continue; } seen.add(key);
      const co = c.company ? companyFor(c.company, { address: c.address }) : null;
      const coExisting = co?.existing;
      const dup = S.clients.find(x => x.kind === 'person' && ((c.email && (x.email || '').toLowerCase() === c.email.toLowerCase()) || (keyName(x.contactName) === keyName(c.contactName) && (!coExisting || x.companyId === coExisting.id))));
      const data = { kind: 'person', company: '', contactName: c.contactName, title: c.title, companyId: '', email: c.email, phone: c.phone, address: co && co.create ? '' : c.address, licenseeName: '', notes: c.notes };
      planned.push({ type: 'person', status: dup ? 'dup' : 'new', dupOf: dup, data, coRef: co, coName: c.company });
    } else {
      if (!c.company) { empty++; continue; }
      const k = keyName(c.company); if (seen.has('c|' + k)) { empty++; continue; } seen.add('c|' + k);
      const ex = coIndex.get(k);
      const data = { kind: 'company', company: c.company, contactName: '', title: '', companyId: '', email: c.email, phone: c.phone, address: c.address, licenseeName: '', notes: [c.contactName && 'Contact: ' + c.contactName, c.notes].filter(Boolean).join('\n') };
      if (ex?.existing) planned.push({ type: 'company', status: 'dup', dupOf: ex.existing, data });
      else if (ex?.create) { Object.keys(data).forEach(f => { if (!ex.create[f] && data[f]) ex.create[f] = data[f]; }); }
      else { const e = { create: data }; coIndex.set(k, e); planned.push({ type: 'company', status: 'new', ref: e, data }); }
    }
  }
  return { planned, empty };
}
function importContactsModal() {
  const st = { sheets: null, sheet: 0, header: true, map: {}, dupMode: 'skip', fileName: '', mode: 'auto' };
  const bg = modal(`<h2>Import contacts</h2><div id="imp"></div>`, { wide: true });
  const box = $('#imp', bg);
  const rowsAll = () => st.sheets ? st.sheets[st.sheet].rows : [];
  const headers = () => { const r = rowsAll(); const w = Math.max(0, ...r.map(x => x.length)); return st.header ? Array.from({ length: w }, (_, i) => r[0]?.[i] || `Column ${i + 1}`) : Array.from({ length: w }, (_, i) => `Column ${i + 1}`); };
  const dataRows = () => st.header ? rowsAll().slice(1) : rowsAll();
  function step1(err = '') {
    box.innerHTML = `<p class="sub">Bring in your address book from BlinkBid, Google Contacts, Outlook, Apple Contacts or any spreadsheet. Separate company and people lists work too: import one, then the other. People are linked to their company by name. Nothing is saved until you confirm.</p>
      <label class="btn pri" style="padding:10px 16px">Choose file…<input type="file" accept=".csv,.tsv,.txt,.xlsx,.xls,.vcf,.vcard,text/csv" hidden id="imp-file"></label>
      <p class="hint" style="margin-top:10px">Accepts <b>.csv</b>, <b>.xlsx</b> (Excel / Numbers) and <b>.vcf</b> (Apple Contacts / iCloud). Older <b>.xls</b> files: open them in Excel or Numbers and save as .xlsx or CSV first.</p>
      ${err ? `<div class="banner" style="background:#fbe3e0;border-color:#efb1a8">${esc(err)}</div>` : ''}`;
    $('#imp-file', box).addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return; st.fileName = f.name;
      try {
        const ext = f.name.split('.').pop().toLowerCase();
        if (ext === 'xls') throw new Error('This is an older Excel (.xls) file. Open it in Excel or Numbers, choose File → Save As (or Export) → .xlsx or CSV, then import that file.');
        if (ext === 'xlsx' || ext === 'xlsm') { st.sheets = await readXLSX(await f.arrayBuffer()); if (!st.sheets.length) throw new Error('No sheets with data found in that workbook.'); st.sheet = Math.max(0, st.sheets.findIndex(s => s.rows.length)); }
        else if (ext === 'vcf' || ext === 'vcard') st.sheets = [{ name: 'Contacts', rows: parseVCF(await f.text()) }];
        else st.sheets = [{ name: f.name, rows: parseCSV(await f.text()) }];
        if (!rowsAll().length) throw new Error('That file has no rows.');
        st.map = guessMapping(headers());
        const hasName = st.map.fullName != null || st.map.firstName != null || st.map.lastName != null;
        st.mode = hasName ? 'auto' : 'companies'; step2();
      } catch (er) { step1(er.message || String(er)); }
    });
  }
  function step2() {
    const H = headers(); const { planned, empty } = planImport(dataRows(), st.map, st.mode);
    const nc = planned.filter(x => x.type === 'company' && x.status === 'new').length, np = planned.filter(x => x.type === 'person' && x.status === 'new').length;
    const dups = planned.filter(x => x.status === 'dup').length;
    const linked = planned.filter(x => x.type === 'person' && x.status === 'new' && x.coRef).length;
    const preview = planned.slice(0, 8);
    const coOf = x => x.type === 'person' ? (x.coName ? x.coName + (x.coRef?.existing ? '' : ' (new)') : 'Independent') : '';
    box.innerHTML = `<div class="row" style="margin-bottom:10px"><b>${esc(st.fileName)}</b><span class="sub">${dataRows().length} rows</span><span style="flex:1"></span>
        ${st.sheets.length > 1 ? `<select id="imp-sheet" style="width:auto">${st.sheets.map((s, i) => `<option value="${i}" ${i === st.sheet ? 'selected' : ''}>Sheet: ${esc(s.name)}</option>`).join('')}</select>` : ''}
        <label class="chk"><input type="checkbox" id="imp-head" ${st.header ? 'checked' : ''}> First row is column names</label><button class="btn sm" id="imp-back">Choose another file</button></div>
      <div class="row" style="margin-bottom:12px"><span class="sub">Each row is a</span><div class="chips">
        <button class="chipbtn ${st.mode === 'auto' ? 'on' : ''}" data-mode="auto">Person or company (automatic)</button>
        <button class="chipbtn ${st.mode === 'companies' ? 'on' : ''}" data-mode="companies">Company</button>
        <button class="chipbtn ${st.mode === 'people' ? 'on' : ''}" data-mode="people">Person</button></div></div>
      <div class="card" style="padding:12px 14px"><h3>Match columns</h3><div class="grid g3">${IMPORT_FIELDS.map(([f, l]) => `<label class="f"><span>${l}</span><select data-map="${f}"><option value="">—</option>${H.map((h, i) => `<option value="${i}" ${st.map[f] === i ? 'selected' : ''}>${esc(h)}</option>`).join('')}</select></label>`).join('')}</div>
        <div class="hint" style="margin-top:8px">Columns were matched automatically. Fix anything that's off; the preview updates as you go. <b>Automatic</b>: rows with a person's name become people (linked to their company, which is created if it's new); rows with only a company become companies.</div></div>
      <div class="card tablecard"><table class="t"><thead><tr><th>Type</th><th>Name</th><th>Company</th><th>Email / phone</th><th>Address</th></tr></thead><tbody>${preview.map(x => `<tr style="${x.status === 'dup' ? 'opacity:.55' : ''}"><td><span class="ktag ${x.type === 'person' ? 'p' : 'c'}">${x.type === 'person' ? 'Person' : 'Company'}</span>${x.status === 'dup' ? '<div><span class="badge">Already in contacts</span></div>' : ''}</td><td><b>${esc(x.type === 'person' ? x.data.contactName : x.data.company)}</b>${x.data.title ? `<div class="sub">${esc(x.data.title)}</div>` : ''}</td><td>${esc(coOf(x)) || '<span class="sub">—</span>'}</td><td>${esc(x.data.email)}<div class="sub">${esc(x.data.phone)}</div></td><td style="white-space:pre-line;font-size:12px">${esc(x.data.address)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">Nothing to import with this column matching.</td></tr>'}</tbody></table></div>
      <div class="row" style="margin-top:4px"><span><b>${nc}</b> new compan${nc === 1 ? 'y' : 'ies'} · <b>${np}</b> new ${np === 1 ? 'person' : 'people'}${linked ? ` (${linked} linked to a company)` : ''}</span>
        ${dups ? `<span>· <b>${dups}</b> already in contacts</span><select id="imp-dup" style="width:auto">${opt('skip', 'Skip those', st.dupMode)}${opt('fill', 'Fill in their missing details', st.dupMode)}</select>` : ''}
        ${empty ? `<span class="sub">· ${empty} blank or repeated row${empty === 1 ? '' : 's'} ignored</span>` : ''}</div>
      <div class="acts"><button class="btn" data-a="cancel">Cancel</button><button class="btn pri" id="imp-go" ${nc + np || (dups && st.dupMode === 'fill') ? '' : 'disabled'}>Import ${nc + np} contact${nc + np === 1 ? '' : 's'}${dups && st.dupMode === 'fill' ? ` + update ${dups}` : ''}</button></div>`;
    $$('[data-map]', box).forEach(s => s.addEventListener('change', () => { const v = s.value; if (v === '') delete st.map[s.dataset.map]; else st.map[s.dataset.map] = +v; step2(); }));
    $$('[data-mode]', box).forEach(b => b.addEventListener('click', () => { st.mode = b.dataset.mode; step2(); }));
    $('#imp-head', box).addEventListener('change', e => { st.header = e.target.checked; st.map = st.header ? guessMapping(headers()) : {}; step2(); });
    $('#imp-sheet', box)?.addEventListener('change', e => { st.sheet = +e.target.value; st.map = guessMapping(headers()); step2(); });
    $('#imp-dup', box)?.addEventListener('change', e => { st.dupMode = e.target.value; step2(); });
    $('#imp-back', box).addEventListener('click', () => step1());
    $('[data-a="cancel"]', box).addEventListener('click', () => bg.remove());
    $('#imp-go', box).addEventListener('click', () => {
      const { planned: P } = planImport(dataRows(), st.map, st.mode); let nNew = 0, upd = 0;
      P.filter(x => x.type === 'company' && x.status === 'new').forEach(x => { const c = { id: uid(), ...x.data, createdAt: nowISO(), source: 'import' }; x.ref.existing = c; S.clients.push(c); nNew++; });
      P.filter(x => x.type === 'person').forEach(x => {
        const coId = x.coRef?.existing?.id || '';
        if (x.status === 'new') { S.clients.push({ id: uid(), ...x.data, companyId: coId, createdAt: nowISO(), source: 'import' }); nNew++; }
        else if (st.dupMode === 'fill') { const d = x.dupOf; let ch = false; ['contactName', 'title', 'email', 'phone', 'address', 'notes'].forEach(k => { if (!d[k] && x.data[k]) { d[k] = x.data[k]; ch = true; } }); if (!d.companyId && coId) { d.companyId = coId; ch = true; } if (ch) upd++; }
      });
      if (st.dupMode === 'fill') P.filter(x => x.type === 'company' && x.status === 'dup').forEach(x => { const d = x.dupOf; let ch = false; ['email', 'phone', 'address', 'notes'].forEach(k => { if (!d[k] && x.data[k]) { d[k] = x.data[k]; ch = true; } }); if (ch) upd++; });
      touch(); bg.remove(); go('#/clients');
      toast(`Imported ${nNew} contact${nNew === 1 ? '' : 's'}${upd ? `, updated ${upd}` : ''}`, 3500);
    });
  }
  step1();
}
</script>
